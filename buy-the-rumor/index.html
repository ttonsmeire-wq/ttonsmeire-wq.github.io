<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<title>BUY THE RUMOR — Bizness Games (Beta v0.5)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600&family=Silkscreen&family=VT323&family=IBM+Plex+Mono:wght@400;600&family=Old+Standard+TT:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--num:"IBM Plex Mono",Consolas,Menlo,monospace;
  --cream:#f3ead7; --paper:#efe4c8; --ink:#3a2a1a; --ink2:#6b5440; --burg:#8c2f39; --mustard:#d9a441;
  --navy:#26324d; --green:#2f7d4a; --red:#b8323b; --crt:#0e2416; --crtfg:#8dffa6;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#141018;font-family:"Pixelify Sans",system-ui,sans-serif;color:var(--ink)}
#stage{position:fixed;left:50%;top:50%;width:960px;height:540px;transform-origin:center center;overflow:hidden;background:#000;user-select:none}
#scene{position:absolute;left:0;top:0;width:960px;height:540px;image-rendering:pixelated}
.px{font-family:Silkscreen,"Pixelify Sans",monospace}
button{font-family:"Pixelify Sans",system-ui,sans-serif;font-size:14px;cursor:pointer;border:2px solid var(--ink);background:var(--cream);color:var(--ink);padding:5px 12px;box-shadow:2px 2px 0 var(--ink)}
button:hover:not(:disabled){background:var(--mustard)}
button:active:not(:disabled){transform:translate(2px,2px);box-shadow:none}
button:disabled{opacity:.4;cursor:not-allowed}
button.primary{background:var(--burg);color:#fff;border-color:#3a1218}
button.primary:hover:not(:disabled){background:#a63a45}
.hidden{display:none!important}
/* ---- scene overlays ---- */
#monitor{position:absolute;left:351px;top:225px;width:258px;height:174px;padding:8px 10px;font-family:var(--num);font-variant-numeric:tabular-nums;color:var(--crtfg);font-size:14.5px;line-height:1.3;pointer-events:none;text-shadow:0 0 6px rgba(141,255,166,.55);overflow:hidden}
#monitor .t{color:#ffd27a;font-family:VT323,monospace;font-size:19px}
#deskHead{position:absolute;left:50px;top:361px;width:228px;max-height:51px;overflow:hidden;font-family:"Old Standard TT",Georgia,serif;font-weight:700;font-size:15px;line-height:1.05;color:#2a2018;pointer-events:none;text-align:center}
#deskMast{position:absolute;left:50px;top:341px;width:228px;font-family:"Old Standard TT",Georgia,serif;font-size:12px;color:#2a2018;text-align:center;pointer-events:none;letter-spacing:1px}
#doorPlate{position:absolute;left:812px;top:90px;width:84px;font-family:Silkscreen,monospace;font-size:9px;color:#3a2a1a;text-align:center;pointer-events:none;line-height:1.1}
#chadPlate{position:absolute;left:660px;top:234px;width:102px;font-family:Silkscreen,monospace;font-size:8px;color:#f3ead7;text-align:center;pointer-events:none}
#padBadge{position:absolute;left:820px;top:470px;font-size:14px;color:var(--burg);pointer-events:none;font-weight:600}
#ring{position:absolute;left:640px;top:296px;font-family:Silkscreen,monospace;font-size:18px;color:#fff;background:var(--burg);padding:2px 8px;border:2px solid #3a1218;pointer-events:none;animation:ringb .25s infinite alternate}
@keyframes ringb{from{transform:rotate(-6deg)}to{transform:rotate(6deg)}}
/* ---- hotspots ---- */
.hs{position:absolute;cursor:pointer;border:2px dashed transparent;border-radius:3px}
.hs:hover{border-color:#fff3c4;background:rgba(255,243,196,.08)}
.hs .lbl{display:none;position:absolute;left:50%;top:-30px;transform:translateX(-50%);white-space:nowrap;background:var(--ink);color:var(--cream);padding:3px 8px;font-size:13px;border:2px solid var(--mustard)}
.hs:hover .lbl{display:block}
.hs.lock{cursor:not-allowed}
.hs.lock:hover{border-color:rgba(255,255,255,.25);background:rgba(0,0,0,.15)}
#stage.hovering #arrow{display:none}
#arrow{position:absolute;width:0;height:0;border-left:14px solid transparent;border-right:14px solid transparent;border-top:20px solid var(--mustard);filter:drop-shadow(2px 2px 0 #3a2a1a);animation:bob .6s infinite alternate;pointer-events:none}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(8px)}}
/* ---- HUD ---- */
#hud{position:absolute;left:0;top:0;width:960px;height:40px;background:var(--ink);color:var(--cream);display:flex;align-items:center;gap:14px;padding:0 10px;border-bottom:3px solid var(--mustard);z-index:5}
#hud .face{width:30px;height:30px;image-rendering:pixelated;border:2px solid var(--mustard);background:#5b4a3a}
#hud .who{line-height:1.05}
#hud .who b{font-size:14px} #hud .who span{font-size:11px;color:#d9c9a6}
#hud .st{display:flex;flex-direction:column;line-height:1.05}
#hud .st span{font-family:Silkscreen,monospace;font-size:8px;color:#bfae8a}
#hud .st b{font-family:var(--num);font-variant-numeric:tabular-nums;font-size:14px;font-weight:600}
#hud .sp{flex:1}
#hud button{font-size:11px;padding:2px 7px;box-shadow:1px 1px 0 #000}
.pos{color:#7fe08f}.neg{color:#ff8a8a}
#objective{position:absolute;left:10px;top:48px;max-width:420px;background:rgba(243,234,215,.96);border:2px solid var(--ink);box-shadow:3px 3px 0 var(--ink);padding:5px 10px;font-size:14px;z-index:4}
#objective b{font-family:Silkscreen,monospace;font-size:10px;color:var(--burg);display:block}
#endDay{position:absolute;right:12px;top:50px;z-index:4;font-size:15px}
#heatBox{position:absolute;right:12px;top:92px;z-index:4;background:rgba(58,42,26,.9);color:var(--cream);padding:4px 8px;border:2px solid var(--burg);font-size:12px}
#heatBox .bar{width:110px;height:8px;background:#000;margin-top:3px;border:1px solid #bfae8a}
#heatBox .bar i{display:block;height:100%;background:var(--red)}
/* ---- windows ---- */
#win{position:absolute;z-index:10;animation:pop .16s ease-out}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:none;opacity:1}}
.wclose{position:absolute;right:8px;top:6px;padding:0 8px;font-size:14px;z-index:2}
#shade{position:absolute;inset:0;background:rgba(10,6,4,.55);z-index:9}
/* computer */
.crt{background:#d8cfba;border:3px solid var(--ink);box-shadow:5px 5px 0 rgba(0,0,0,.5);padding:10px 12px 12px;border-radius:10px}
.crt .scr{background:var(--crt);border:3px solid #1b120a;border-radius:8px;height:100%;color:var(--crtfg);font-family:var(--num);font-variant-numeric:tabular-nums;font-size:14px;padding:6px 10px;position:relative;box-shadow:inset 0 0 30px rgba(0,0,0,.7)}
.crt .scr::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.18) 0 1px,transparent 1px 3px);border-radius:6px}
.crt button{white-space:nowrap;font-family:var(--num);font-size:13px;background:#123a22;color:var(--crtfg);border:1px solid #4fbf6a;box-shadow:none;padding:1px 9px}
.crt button:hover:not(:disabled){background:var(--crtfg);color:#06140a}
.crt button.on{background:var(--crtfg);color:#06140a}
.crt button.sh{border-color:#ff8a8a;color:#ff8a8a}
.crt .bar{display:flex;align-items:center;gap:8px;border-bottom:1px solid #2c6b3e;padding-bottom:4px;margin-bottom:5px}
.crt .bar .ttl{color:#ffd27a;flex:1;font-family:VT323,monospace;font-size:20px}
.crt .vt{font-family:VT323,monospace}
.crt table{border-collapse:collapse;width:100%}
.crt td,.crt th{padding:0 4px;white-space:nowrap;line-height:19px}
.crt th{color:#4fbf6a;font-weight:normal;text-align:left;font-size:11px}
.crt tr.rw{cursor:pointer} .crt tr.rw:hover{background:#163d26} .crt tr.sel{background:#1f5233}
.crt .up{color:#7dff8f}.crt .dn{color:#ff7b7b}.crt .y{color:#ffd27a}.crt .d{color:#4fbf6a}
.crt input{font-family:var(--num);font-size:14px;width:70px;background:#000;color:#fff;border:1px solid #4fbf6a;padding:0 4px}
.crt .box{border:1px solid #2c6b3e;padding:2px 6px}
.crt .box span{display:block;font-size:10px;color:#4fbf6a;line-height:1.2}
#chart{display:block;width:100%;height:150px;border:1px solid #2c6b3e;margin:3px 0}
#pchart{display:block;width:100%;height:130px;border:1px solid #2c6b3e;margin-top:6px}
/* newspaper */
.paperwin{background:var(--paper);border:3px solid var(--ink);box-shadow:6px 6px 0 rgba(0,0,0,.5);padding:14px 22px;font-family:"Old Standard TT",Georgia,serif;color:#221a12;transform:rotate(-.6deg)}
.mast{text-align:center;font-size:40px;font-weight:700;letter-spacing:1px;border-bottom:4px double #221a12;line-height:1.1}
.dateline{display:flex;justify-content:space-between;font-size:12px;border-bottom:1px solid #221a12;padding:2px 0;margin-bottom:8px;text-transform:uppercase}
.lead{font-size:25px;font-weight:700;line-height:1.1;margin:4px 0 4px}
.cols{display:grid;grid-template-columns:1.25fr 1fr;gap:16px}
.story{font-size:15px;line-height:1.25;padding:4px 0;border-bottom:1px solid #b9a988;font-weight:700}
.story small{font-weight:400;color:#5b4a37}
.pbox{border:2px solid #221a12;padding:4px 8px;margin-bottom:8px}
.pbox h4{margin:0 0 3px;font-size:13px;text-transform:uppercase;letter-spacing:1px;border-bottom:1px solid #221a12}
.pbox div{font-size:13px;line-height:1.3;padding:1px 0}
.tkl{color:var(--burg);font-weight:700}
/* phone */
.phonewin{background:#e8dcc0;border:3px solid var(--ink);box-shadow:6px 6px 0 rgba(0,0,0,.5);padding:12px 14px}
.phonewin h3,.padwin h3{margin:0 0 8px;font-family:Silkscreen,monospace;font-size:16px;color:var(--burg)}
.ccard{display:flex;gap:10px;align-items:center;background:var(--cream);border:2px solid var(--ink);padding:5px 8px;margin-bottom:6px}
.ccard canvas{width:44px;height:44px;image-rendering:pixelated;border:2px solid var(--ink);background:#7c6a55;flex:none}
.ccard .nm{font-weight:600;font-size:15px}
.ccard .ds{font-size:12px;color:var(--ink2);line-height:1.2}
.ccard button{margin-left:auto;font-size:13px;padding:3px 9px;flex:none}
.transcript{background:var(--cream);border:2px solid var(--ink);padding:8px 10px;height:100%;overflow:hidden;font-size:14px;line-height:1.35}
.chirp{border-bottom:1px dashed #b9a988;padding:4px 0}
/* notepad */
.padwin{background:#f4e48a;border:3px solid var(--ink);box-shadow:6px 6px 0 rgba(0,0,0,.5);padding:12px 18px 12px 46px;
  background-image:linear-gradient(90deg,transparent 34px,#d9534f 34px,#d9534f 36px,transparent 36px),repeating-linear-gradient(0deg,transparent 0 25px,#8fb3d9 25px 26px)}
.note{font-size:14px;line-height:1.25;padding:4px 0 5px;border-bottom:1px solid rgba(58,42,26,.15)}
.note .m{font-family:Silkscreen,monospace;font-size:9px;color:var(--ink2)}
.stamp{font-family:Silkscreen,monospace;font-size:9px;padding:0 4px;border:2px solid;margin-left:6px}
.stamp.ok{color:var(--green)} .stamp.no{color:var(--red)} .stamp.pend{color:var(--ink2)}
/* dialogue */
#dlg{position:absolute;left:24px;top:396px;width:912px;height:132px;background:var(--cream);border:3px solid var(--ink);box-shadow:5px 5px 0 rgba(0,0,0,.55);z-index:30;display:flex;gap:12px;padding:10px;cursor:pointer}
#dlg canvas{width:108px;height:108px;image-rendering:pixelated;border:3px solid var(--ink);background:#7c6a55;flex:none}
#dlg .dn{font-family:Silkscreen,monospace;font-size:13px;color:var(--burg)}
#dlg .dt{font-size:18px;line-height:1.3;margin-top:4px;min-height:48px}
#dlg .dc{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
#dlg .dc button{font-size:14px}
#dlg .dm{position:absolute;right:14px;bottom:8px;animation:bob .5s infinite alternate;color:var(--burg)}
/* cards */
#card{position:absolute;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;background:rgba(10,6,4,.45)}
.cardbox{background:var(--cream);border:3px solid var(--ink);box-shadow:8px 8px 0 rgba(0,0,0,.6);padding:18px 26px;max-width:720px;width:92%}
.cardbox h1{font-family:Silkscreen,monospace;font-weight:normal;color:var(--burg);font-size:26px;margin:0 0 8px}
.cardbox h2{font-family:Silkscreen,monospace;font-weight:normal;font-size:16px;margin:10px 0 6px}
.cardbox p{font-size:16px;line-height:1.35;margin:6px 0}
.kv{display:grid;grid-template-columns:1fr auto;gap:2px 18px;font-size:16px}
.kv span{color:var(--ink2)} .kv b{text-align:right;font-weight:600;font-family:var(--num);font-variant-numeric:tabular-nums;font-size:15px}
.g{color:var(--green)} .r{color:var(--red)}
.btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.logo{font-family:Silkscreen,monospace;font-size:64px;line-height:.95;color:var(--mustard);text-align:center;text-shadow:4px 4px 0 var(--burg),8px 8px 0 #000}
.bgopt{border:2px solid var(--ink);padding:6px 10px;margin:5px 0;cursor:pointer;background:#fff8e8}
.bgopt.on{background:var(--mustard)}
.bgopt b{font-size:15px} .bgopt div{font-size:13px;color:var(--ink2)}
.cust{display:flex;align-items:center;gap:6px;margin:3px 0;font-size:14px}
.cust span{width:52px}
.cust button{padding:0 8px;font-size:13px;box-shadow:1px 1px 0 var(--ink)}
#creatorFace{width:120px;height:120px;image-rendering:pixelated;border:3px solid var(--ink);background:#7c6a55}
input.txt{font-family:"Pixelify Sans",sans-serif;font-size:18px;padding:4px 8px;border:2px solid var(--ink);background:#fff;width:220px}
#fade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;z-index:60;transition:opacity .45s}
#toasts{position:absolute;right:12px;bottom:14px;display:flex;flex-direction:column;gap:6px;z-index:70;align-items:flex-end}
.toast{background:var(--ink);color:var(--cream);border:2px solid var(--mustard);padding:6px 11px;font-size:14px;animation:tf 3.4s forwards;max-width:420px}
.toast.bad{border-color:#ff8a8a}
@keyframes tf{0%{opacity:0;transform:translateY(8px)}8%{opacity:1;transform:none}85%{opacity:1}100%{opacity:0}}
#bigText{position:absolute;left:0;right:0;top:200px;text-align:center;font-family:Silkscreen,monospace;font-size:54px;color:var(--mustard);text-shadow:4px 4px 0 var(--burg),7px 7px 0 #000;z-index:55;pointer-events:none;opacity:0;transition:opacity .3s}

/* ================= MOBILE (body.m) ================= */
html,body{touch-action:manipulation;-webkit-text-size-adjust:100%}
#ui{position:fixed;inset:0;pointer-events:none;z-index:20}
#ui>*{pointer-events:auto}
#ui>.hidden{display:none!important}
#rotate{display:none}
body.m.portrait #rotate{display:flex;position:fixed;inset:0;z-index:99999;background:#1b130d;color:#f3ead7;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-size:20px;padding:30px}
#rotate .ph{font-size:64px;animation:rot 1.6s ease-in-out infinite}
@keyframes rot{0%,30%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
.m #hud{position:fixed;left:0;right:0;top:0;width:auto;height:48px;padding:0 max(6px,env(safe-area-inset-right)) 0 max(6px,env(safe-area-inset-left));gap:10px}
.m #hud .st span{font-size:7px}.m #hud .st b{font-size:12.5px}
.m #hud button{min-height:44px;min-width:44px;font-size:15px;padding:0 8px}
.m #hud .lab{display:none}
.m #hud .goalst b{max-width:150px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:760px){.m #hud .face,.m #hud .who{display:none}}
.m #objective{position:fixed;top:54px;left:max(6px,env(safe-area-inset-left));max-width:46vw;font-size:13px;padding:4px 8px}
.m #endDay{position:fixed;top:54px;right:max(6px,env(safe-area-inset-right));min-height:44px;font-size:14px}
.m #heatBox{position:fixed;top:106px;right:max(6px,env(safe-area-inset-right));font-size:11px}
.m #toasts{position:fixed;right:8px;bottom:8px}
.m .toast{font-size:13px}
.m #bigText{position:fixed;top:38%;font-size:34px}
.m #fade,.m #shade,.m #card{position:fixed;inset:0}
#ui>#fade,#ui>#bigText{pointer-events:none!important}
#ui>#toasts{pointer-events:none}
.m #win{position:fixed;inset:0;z-index:10;animation:none}
.m #win>div{position:fixed!important;left:0!important;top:0!important;width:100vw!important;height:100%!important;max-height:none!important;transform:none!important;border-radius:0!important;box-shadow:none!important;overflow:auto;padding-left:max(10px,env(safe-area-inset-left))!important;padding-right:max(10px,env(safe-area-inset-right))!important}
.m .wclose{min-width:44px;min-height:44px;font-size:18px;right:max(6px,env(safe-area-inset-right));top:4px}
.m .hs .lbl{font-size:24px;top:-46px;padding:4px 10px}
.m .hs.lblb .lbl{top:auto;bottom:-46px}
.m .hs.armed{border-color:#fff3c4;background:rgba(255,243,196,.12)}
.m .hs.armed .lbl{display:block}
.m .hs:hover .lbl{display:none}.m .hs.armed:hover .lbl{display:block}
/* dialogue */
.m #dlg{position:fixed;left:max(6px,env(safe-area-inset-left));right:max(6px,env(safe-area-inset-right));bottom:6px;top:auto;width:auto;height:auto;min-height:104px;padding:8px}
.m #dlg canvas{width:76px;height:76px}
.m #dlg .dt{font-size:15px;min-height:0}
.m #dlg .dc button{min-height:44px;font-size:13px}
/* cards */
.m .cardbox{max-height:calc(100% - 12px);overflow:auto;padding:10px 16px}
.m .cardbox h1{font-size:18px;margin-bottom:4px}.m .cardbox h2{font-size:13px;margin:6px 0 4px}
.m .cardbox p{font-size:14px;margin:3px 0}.m .kv{font-size:13px}.m .kv b{font-size:13px}
.m .btns{margin-top:8px}.m .btns button,.m #card button{min-height:44px}
.m .sumcols{display:grid;grid-template-columns:1.25fr 1fr;gap:16px}
.m .logo{font-size:40px}
.m #creatorFace{width:76px;height:76px}
.m .cust{margin:2px 0}.m .cust button{min-width:44px;min-height:44px}
.m .bgopt{padding:4px 8px;margin:3px 0;min-height:44px}.m .bgopt div{font-size:11.5px}
.m input.txt{font-size:16px}.m input{font-size:16px!important}
/* newspaper / phone / pad */
.m .paperwin{padding:8px 14px}.m .mast{font-size:26px}.m .lead{font-size:18px}.m .story{font-size:13px}.m .pbox div{font-size:12px}
.m .phonewin h3,.m .padwin h3{font-size:14px;margin:4px 50px 6px 0}
.m .phonewin>div[style]{height:auto!important}
.m .ccard{padding:3px 6px;margin-bottom:4px}.m .ccard canvas{width:38px;height:38px}.m .ccard .ds{font-size:11px}
.m .ccard button,.m .padwin button,.m .phonewin button{min-height:44px;min-width:44px}
.m .transcript{font-size:13px}
.m .padwin{padding-left:46px!important}
.m .padwin>div[style*="316px"]{height:auto!important}
/* computer (mobile layout) */
.m .mcrt{padding:4px!important;background:#1b120a!important;border:0!important}
.mcrt .scr{display:flex;flex-direction:column;padding:4px 8px!important}
.mtabs{display:flex;gap:6px;align-items:center;height:48px;flex:none;border-bottom:1px solid #2c6b3e;margin-bottom:6px}
.mtabs button{min-height:44px;min-width:64px;font-size:14px!important}
.mtabs .ttl{flex:1;text-align:center;color:#ffd27a;font-family:VT323,monospace;font-size:20px}
.mtabs .mclose{min-width:44px}
.chips{flex:1;display:grid;grid-template-columns:repeat(6,1fr);grid-template-rows:repeat(3,1fr);gap:5px;min-height:0}
.crt button.chip{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:12px;padding:2px;min-height:44px;position:relative;white-space:nowrap}
.crt button.chip b{color:#ffd27a;font-size:15px}
.crt button.chip i{position:absolute;top:2px;right:4px;font-style:normal;font-size:10px}
.crt button.chip.on{background:#1f5233;color:var(--crtfg)}
.mstock{flex:1;display:grid;grid-template-columns:1.3fr 1fr;gap:10px;min-height:0}
.mstock .ml,.mstock .mr{display:flex;flex-direction:column;gap:5px;min-height:0;overflow:hidden}
.m .mstock #chart{flex:1 1 auto;height:0!important;min-height:60px;margin:0}
.mrow{display:flex;gap:5px;align-items:center;flex-wrap:wrap}
.mrow button{min-height:44px;flex:1 1 0;min-width:44px;padding:0 4px!important}
.mstats{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.mstats .box{font-size:12px;min-height:44px}

function mkEvent(o){o.id='e'+G.events.length;G.events.push(o);return o;}
function addSig(ev,src,a,b,pc,chance){if(rand()>chance)return;const day=Math.max(1,ev.day-rint(a,b));if(day>=ev.day)return;
  if(src==='brayden'&&G.player.bg==='crypto')pc=Math.min(.9,pc+.2);
  const ok=rand()<pc;G.signals.push({id:'s'+(G.sigN++),ev:ev.id,src,day,dir:ok?ev.sign:-ev.sign,used:false});}
function pushSig(ev,src,day,pc){day=Math.max(1,Math.min(day,ev.day-1));const ok=rand()<pc;G.signals.push({id:'s'+(G.sigN++),ev:ev.id,src,day,dir:ok?ev.sign:-ev.sign,used:false});}
function genEvents(){
  for(let d=3;d<=DAYS-1;d++){
    if(rand()>0.42)continue;
    const pool=[];CO.forEach(c=>{pool.push(c);if(c.s==='WILD')pool.push(c);});
    const c=pick(pool),q=G.q[c.t][qtr(d)],sign=rand()<0.5+0.15*q?1:-1;
    let mag=(0.06+rand()*0.12)*Math.sqrt(c.vol/0.016),head,pre=null,preDay=null,sched=false;
    if(c.meme&&rand()<0.6){mag*=1.5;head=(sign>0?pick(MEME_POS):pick(MEME_NEG))(c);}
    else if(rand()<0.32&&d>=6){const tpl=c.t==='FIZR'?SCHED_FDA:pick(SCHED);head=(sign>0?tpl.pos:tpl.neg)(c);pre=tpl.pre(c);preDay=Math.max(1,d-rint(3,6));sched=true;mag*=1.15;}
    else head=(sign>0?pick(STOCK_POS):pick(STOCK_NEG))(c);
    mag=Math.min(mag,c.meme?0.6:0.3);
    const ev=mkEvent({day:d,scope:'stock',target:c.t,sign,head,pre,preDay,sched,earn:false,imp:{[c.t]:sign*mag}});
    addSig(ev,'rumor',1,4,.60,.5);addSig(ev,'chirp',1,5,.55,.5);addSig(ev,'garage',1,4,.92,.55);
    if(c.s==='CONS')addSig(ev,'mom',1,4,.85,.5);
    if(c.s==='WILD')addSig(ev,'brayden',1,4,.60,.75);else addSig(ev,'ana',1,5,.70,.3);
  }
  for(let Q=0;Q<4;Q++)CO.forEach(c=>{
    const d=rint(Q*15+9,Q*15+14),q=G.q[c.t][Q],sign=q+randn()*0.45>=0?1:-1,mag=c.vol*(2.2+rand()*3)*(1+Math.abs(q)*0.5);
    const head=sign>0?`${c.n} beats earnings estimates; raises guidance`:`${c.n} misses earnings; CEO blames "macro headwinds"`;
    const ev=mkEvent({day:d,scope:'stock',target:c.t,sign,head,pre:null,preDay:null,sched:false,earn:true,imp:{[c.t]:sign*Math.min(mag,.35)}});
    addSig(ev,'ana',2,6,.72,.85);addSig(ev,'garage',1,3,.92,.25);addSig(ev,'chirp',1,4,.5,.25);if(c.s==='WILD')addSig(ev,'brayden',1,3,.55,.5);});
  for(let i=0;i<7;i++){const tpl=pick(SECTOR_EV),d=rint(4,DAYS-1),sign=rand()<.5?1:-1,mag=tpl.mag[0]+rand()*(tpl.mag[1]-tpl.mag[0]);
    const imp={};CO.forEach(c=>{if(tpl.imp[c.s])imp[c.t]=sign*mag*tpl.imp[c.s];});
    const ev=mkEvent({day:d,scope:'sector',label:tpl.label,sign,head:sign>0?tpl.pos:tpl.neg,sched:false,earn:false,imp});
    addSig(ev,'sal',1,4,.75,.8);addSig(ev,'rumor',1,3,.6,.4);addSig(ev,'chirp',1,4,.55,.4);}
  const nM=4+(rand()<.5?1:0);
  for(let i=0;i<nM;i++){const tpl=pick(MACRO_EV),d=rint(4,DAYS-1),sign=rand()<.55?1:-1,mag=.02+rand()*.025;const imp={};CO.forEach(c=>imp[c.t]=sign*mag*c.beta);
    const ev=mkEvent({day:d,scope:'macro',sign,head:sign>0?tpl.pos:tpl.neg,sched:false,earn:false,imp});addSig(ev,'sal',1,4,.75,.85);addSig(ev,'rumor',1,3,.6,.4);}
  if(rand()<0.35){const d=rint(20,DAYS-3),imp={};CO.forEach(c=>imp[c.t]=-0.075*c.beta);
    const ev=mkEvent({day:d,scope:'macro',sign:-1,head:'FLASH CRASH: algorithm mistakes a cat video for a recession signal',sched:false,earn:false,imp});addSig(ev,'sal',1,3,.8,.9);addSig(ev,'chirp',1,2,.6,.6);}
  // opening storylines tuned to the unlock order (rumor Day 1, Sal Day 2)
  const c1=pick(CO.filter(c=>!c.meme&&c.vol>=.014)),s1=rand()<.5?1:-1;
  const o1=mkEvent({day:3,scope:'stock',target:c1.t,sign:s1,head:(s1>0?pick(STOCK_POS):pick(STOCK_NEG))(c1),pre:null,preDay:null,sched:false,earn:false,imp:{[c1.t]:s1*0.12*Math.sqrt(c1.vol/0.016)}});
  pushSig(o1,'rumor',1,.75);pushSig(o1,'sal',2,.85);
  const c2=pick(CO.filter(c=>c.t!==c1.t&&c.s==='CONS')),s2=rand()<.5?1:-1,tpl=pick(SCHED),d2=rint(5,7);
  const o2=mkEvent({day:d2,scope:'stock',target:c2.t,sign:s2,head:(s2>0?tpl.pos:tpl.neg)(c2),pre:tpl.pre(c2),preDay:1,sched:true,earn:false,imp:{[c2.t]:s2*0.11*Math.sqrt(c2.vol/0.016)}});
  pushSig(o2,'mom',3,.85);
  G.evById=Object.fromEntries(G.events.map(e=>[e.id,e]));
}
function buildNews(){
  const d=G.day;G.news=[];
  if(d===1)G.news.push({txt:'Markets open a new fiscal year; traders cautiously optimistic, heavily caffeinated',tag:'MARKETS',major:true});
  G.events.filter(e=>e.day===d).forEach(e=>G.news.push({txt:e.head,tag:e.scope==='stock'?e.target:e.scope==='sector'?e.label.toUpperCase():'MARKETS',major:true,t:e.scope==='stock'?e.target:null,earn:e.earn}));
  G.news.sort((a,b)=>(a.earn?1:0)-(b.earn?1:0));
  G.events.filter(e=>e.sched&&e.preDay===d).forEach(e=>G.news.push({txt:`${e.pre} on Day ${e.day}`,tag:'CALENDAR',t:e.target}));
  G.filler=pick(FILLER);
  G.rumors=G.signals.filter(s=>s.src==='rumor'&&s.day===d);
  G.rumors.forEach(s=>{s.used=true;addLog('rumor',tipText(s),s.id,tOfSig(s));});
}
function upcoming(){const d=G.day;return G.events.filter(e=>e.day>d&&((e.sched&&e.preDay<=d)||(e.earn&&e.day-d<=5))).sort((a,b)=>a.day-b.day);}
function tOfSig(s){const e=EV(s.ev);return e.scope==='stock'?e.target:null;}
function whenTxt(ev){const n=ev.day-G.day;return n<=1?'by tomorrow':`in the next ${n} days or so`;}
function tipText(s){
  const ev=EV(s.ev),up=s.dir>0,subj=subjOf(ev),c=ev.scope==='stock'?COMAP[ev.target]:null;
  switch(s.src){
   case 'garage':return up?`${subj}. Something big, and good. ${cap(whenTxt(ev))}. You didn't hear it from me.`:`${subj}. Bad news is coming ${whenTxt(ev)}. Their lawyers are billing overtime. We never spoke.`;
   case 'sal':return up?`Kid, I smell a rally in ${subj} ${whenTxt(ev)}. This old nose is never wrong... usually.`:`Batten down the hatches on ${subj}. I smell trouble ${whenTxt(ev)}.`;
   case 'ana':return ev.earn?`Our model says ${c.n} ${up?'BEATS':'MISSES'} estimates when they report on Day ${ev.day}. Confidence: high-ish.`:`We're ${up?'upgrading':'downgrading'} ${subj} this week. Something is ${up?'brewing':'off'} over there.`;
   case 'mom':return up?`Honey, everyone at book club is suddenly obsessed with ${c.n}. Are you eating vegetables?`:`Sweetie, the book club ladies are boycotting ${c.n}. Something about a scandal. Call your grandmother.`;
   case 'brayden':return up?`BRO. ${c.t} is about to MOON 🚀 Like ${whenTxt(ev)}. I watched a whole video about it.`:`Dude. ${c.t} is about to get rugged 📉 Like ${whenTxt(ev)}. Not financial advice.`;
   case 'rumor':return up?`Insiders whisper of good news for ${subj}.`:`Whispers of trouble brewing at ${subj}.`;
   case 'chirp':return up?`${pick(CHIRP_HANDLES)}: my sources say ${subj} is about to rip 📈`:`${pick(CHIRP_HANDLES)}: ${subj} looks shaky. Something's coming 🐻`;
  }return '...';
}
function addLog(src,text,sig,t){G.log.unshift({day:G.day,src,text,sig,t});}
function verdictOf(l){if(!l.sig)return null;const s=G.signals.find(x=>x.id===l.sig);if(!s)return null;const ev=EV(s.ev);
  if(ev.day>G.day)return{txt:`PENDING · DAY ${ev.day}`,c:'pend'};return s.dir===ev.sign?{txt:'✔ RIGHT',c:'ok'}:{txt:'✘ WRONG',c:'no'};}

/* trading */
function maxBuy(t){return Math.max(0,Math.floor((G.cash-FEE)/price(t)));}
function maxShort(t){return Math.max(0,Math.floor((netWorth()-shortValue()-FEE)/price(t)));}
function lockFlagged(t,p){G.flagged.forEach(f=>{if(f.t===t&&f.closedP==null)f.closedP=p;});}
function suspiciousProfit(){return G.flagged.reduce((a,f)=>a+Math.max(0,((f.closedP!=null?f.closedP:price(f.t))-f.p)*f.dir*f.qty),0);}
function trade(t,side,qty){
  if(G.over)return;qty=Math.floor(qty);if(!(qty>0)){toast('Type how many shares first.','bad');return;}
  if((side==='short'||side==='cover')&&!G.unlock.short){toast('The Boss hasn\'t approved shorting yet.','bad');return;}
  const p=price(t),ps=G.pos[t]||{qty:0,avg:0};let realized=0;
  if(side==='buy'){if(ps.qty<0){toast('You\'re short this stock. COVER it first.','bad');return;}
    if(qty*p+FEE>G.cash){toast('Not enough cash.','bad');return;}G.cash-=qty*p+FEE;ps.avg=(ps.avg*ps.qty+p*qty)/(ps.qty+qty);ps.qty+=qty;}
  else if(side==='sell'){if(ps.qty<=0){toast('You don\'t own any to sell.','bad');return;}qty=Math.min(qty,ps.qty);G.cash+=qty*p-FEE;realized=(p-ps.avg)*qty;ps.qty-=qty;}
  else if(side==='short'){if(ps.qty>0){toast('You own this stock. SELL before shorting.','bad');return;}
    if(qty>maxShort(t)){toast(`Short limit: ${maxShort(t)} shares.`,'bad');return;}G.cash+=qty*p-FEE;const cur=-ps.qty;ps.avg=(ps.avg*cur+p*qty)/(cur+qty);ps.qty-=qty;}
  else if(side==='cover'){if(ps.qty>=0){toast('No short position to cover.','bad');return;}qty=Math.min(qty,-ps.qty);
    if(qty*p+FEE>G.cash){toast('Not enough cash to cover.','bad');return;}G.cash-=qty*p+FEE;realized=(ps.avg-p)*qty;ps.qty+=qty;}
  if(ps.qty===0){ps.avg=0;lockFlagged(t,p);}
  G.pos[t]=ps;if(ps.qty===0)delete G.pos[t];
  G.stats.trades++;G.stats.fees+=FEE;
  if(side==='sell'||side==='cover'){G.stats.realized+=realized;if(!G.stats.best||realized>G.stats.best.v)G.stats.best={t,v:realized};if(!G.stats.worst||realized<G.stats.worst.v)G.stats.worst={t,v:realized};}
  G.trades.push({t,day:G.day,side,qty,p});
  if(side==='buy'||side==='short'){const dir=side==='buy'?1:-1;const tip=G.insider.find(x=>x.t===t&&x.evDay>G.day&&x.dir===dir);
    if(tip){const add=8+Math.round(14*Math.min(1,qty*p/Math.max(1,netWorth())*2));G.heat=Math.min(100,G.heat+add);G.flagged.push({t,qty,p,dir,day:G.day});G.stats.insiderTrades++;toast(`Somewhere, a regulator raises an eyebrow. (+${add} heat)`,'bad');}}
  toast(`${side.toUpperCase()} ${qty} ${t} @ ${fm(p)}`+(realized?` · ${realized>=0?'profit':'loss'} ${fm(realized)}`:''),realized<0?'bad':'');
  if(realized>0)sfx('cash');else sfx('click');
  if(G.tut==='buy'&&side==='buy')tutAfterBuy();
  save();refresh();
}

/* end of day simulation */
function simulateClose(){
  const d=G.day;const m=0.0001+randn()*0.007;const sr={};for(const s in SECTORS)sr[s]=randn()*0.005;
  const ep={};CO.forEach(c=>ep[c.t]=0);
  G.events.forEach(e=>{const w=e.day===d?0.4:e.day===d+1?0.6:0;if(!w)return;for(const t in e.imp)ep[t]+=w*e.imp[t];});
  let sum=0;
  CO.forEach(c=>{const p=price(c.t),q=G.q[c.t][qtr(d)];let r=c.beta*m+sr[c.s]+randn()*c.vol*0.85+q*0.0007+ep[c.t];r=clamp(r,-0.7,1.2);
    const np=Math.max(0.5,+(p*Math.exp(r)).toFixed(2));G.hist[c.t].push(np);sum+=np/p-1;});
  const ir=sum/CO.length;G.idx.push(G.idx[G.idx.length-1]*(1+ir));G.lastIdxMove=ir;
  G.chad.push(G.chad[G.chad.length-1]*(1+ir*1.1+0.0009+randn()*0.011));
  let fee=0;for(const t in G.pos){const q=G.pos[t].qty;if(q<0)fee+=-q*price(t)*(COMAP[t].meme?0.002:0.0005);}G.cash-=fee;G.stats.borrow+=fee;
  G.divAcc=G.divAcc||{};for(const t in G.pos){const c=COMAP[t];if(c.dy)G.divAcc[t]=(G.divAcc[t]||0)+G.pos[t].qty*price(t)*c.dy/DAYS;}
  G.lastDiv=0;if(d%15===0){const tot=divAccTotal();G.cash+=tot;G.stats.divs=(G.stats.divs||0)+tot;G.lastDiv=tot;G.divAcc={};if(Math.abs(tot)>0.005)addLog('sys',`Quarterly dividends ${tot>=0?'paid to you':'charged on your shorts'}: ${fm(tot)}.`,null,null);}
  G.nw.push(netWorth());
}
function divAccTotal(){let s=0;for(const t in (G.divAcc||{}))s+=G.divAcc[t];return s;}
function marginCheck(){const sv=shortValue();if(sv<=0||netWorth()>=0.30*sv)return false;
  for(const t in G.pos){const ps=G.pos[t];if(ps.qty<0){const q=-ps.qty,p=price(t);G.cash-=q*p+FEE;const r=(ps.avg-p)*q;G.stats.realized+=r;
    if(!G.stats.worst||r<G.stats.worst.v)G.stats.worst={t,v:r};G.trades.push({t,day:G.day,side:'cover',qty:q,p});lockFlagged(t,p);delete G.pos[t];}}
  addLog('sys','MARGIN CALL: all shorts were force-covered.',null,null);return true;}

/* quarterly goals */
function goal(Q){
  if(Q===0)return G.player.bg==='legacy'?{txt:'Grow your account at least 5%',sh:'Grow 5% or more',ok:()=>myRet()>=0.05}:{txt:'Don\'t lose money this quarter',sh:'Don\'t lose money',ok:()=>myRet()>=0};

let AC=null,muted=false;
function tone(f,dur=.06,type='square',vol=.035,delay=0){if(muted)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const t0=AC.currentTime+delay;
  const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t0);g.gain.setValueAtTime(vol,t0);g.gain.exponentialRampToValueAtTime(.0001,t0+dur);
  o.connect(g);g.connect(AC.destination);o.start(t0);o.stop(t0+dur+.02);}catch(e){}}
function sfx(k){({click:()=>tone(880,.04),cash:()=>{tone(1320,.06,'square',.04);tone(1760,.12,'square',.04,.07);},
  bell:()=>[0,.22,.44].forEach(d=>tone(1568,.35,'triangle',.06,d)),ring:()=>{for(let i=0;i<4;i++)tone(i%2?1180:1000,.05,'square',.03,i*.06);},
  blip:()=>tone(600+Math.random()*200,.02,'square',.015),page:()=>tone(300,.05,'triangle',.04),bad:()=>{tone(220,.15,'sawtooth',.04);tone(160,.2,'sawtooth',.04,.12);},
  good:()=>[523,659,784,1047].forEach((f,i)=>tone(f,.12,'square',.035,i*.09))}[k]||(()=>{}))();}

function faceGrid(f){
  const g=Array.from({length:16},()=>Array(16).fill(null));
  const set=(x,y,c)=>{if(x>=0&&x<16&&y>=0&&y<16)g[y][x]=c;};
  const fill=(x,y,w,h,c)=>{for(let j=y;j<y+h;j++)for(let i=x;i<x+w;i++)set(i,j,c);};
  const skin=f.skin,dk=shade(skin,-28),hair=f.hair||'#333',hat=f.hat||'#333';
  fill(2,14,12,2,f.shirt);fill(3,13,10,1,f.shirt);fill(7,12,2,1,dk);
  fill(5,3,6,1,skin);fill(4,4,8,7,skin);fill(5,11,6,1,skin);set(3,7,skin);set(12,7,skin);
  set(6,7,f.eye||'#1a1a1a');set(9,7,f.eye||'#1a1a1a');fill(7,9,2,1,'#8a3b3b');set(6,6,dk);set(9,6,dk);
  const hs=f.hs;
  if(hs==='short'){fill(4,2,8,2,hair);fill(4,4,1,2,hair);fill(11,4,1,2,hair);}
  if(hs==='slick'){fill(5,1,6,1,hair);fill(4,2,8,2,hair);set(4,4,hair);set(11,4,hair);set(10,4,hair);}
  if(hs==='long'){fill(5,2,6,1,hair);fill(4,3,8,2,hair);fill(3,4,1,9,hair);fill(12,4,1,9,hair);fill(4,5,1,6,hair);fill(11,5,1,6,hair);}
  if(hs==='bun'){fill(6,0,4,2,hair);fill(5,2,6,1,hair);fill(4,3,8,2,hair);set(4,5,hair);set(11,5,hair);}
  if(hs==='curly'){fill(4,1,8,1,hair);fill(3,2,10,2,hair);fill(3,4,2,5,hair);fill(11,4,2,5,hair);set(5,4,hair);set(10,4,hair);}
  if(hs==='bald'){fill(4,5,1,3,hair);fill(11,5,1,3,hair);}
  if(hs==='cap'){fill(4,2,8,2,hat);fill(5,1,6,1,hat);fill(8,4,6,1,hat);set(4,4,hat);}
  if(hs==='fedora'){fill(5,0,6,3,hat);fill(2,3,12,1,hat);fill(5,2,6,1,shade(hat,-25));}
  const acc=f.acc||[];
  if(acc.includes('collar')){set(6,13,'#fff');set(9,13,'#fff');set(7,13,'#fff');set(8,13,'#fff');}
  if(acc.includes('tie'))fill(7,13,2,3,f.tie||'#c0392b');
  if(acc.includes('pearls'))fill(5,13,6,1,'#fffbe8');
  if(acc.includes('mustache'))fill(6,8,4,1,hair);
  if(acc.includes('glasses')){set(5,7,'#e0c060');set(7,7,'#e0c060');set(8,7,'#e0c060');set(10,7,'#e0c060');set(6,8,'#e0c060');set(9,8,'#e0c060');}
  if(acc.includes('shades'))fill(5,7,6,1,'#111');
  return g;
}
function shade(hex,amt){const n=parseInt(hex.slice(1),16);const r=clamp((n>>16)+amt,0,255),g=clamp(((n>>8)&255)+amt,0,255),b=clamp((n&255)+amt,0,255);return '#'+((r<<16)|(g<<8)|b).toString(16).padStart(6,'0');}
function paintGrid(ctx,g,ox,oy){for(let y=0;y<16;y++)for(let x=0;x<16;x++)if(g[y][x]){ctx.fillStyle=g[y][x];ctx.fillRect(ox+x,oy+y,1,1);}}
const faceCache={};
function faceOf(who){if(who==='player')return G.player.f;return CAST[who]&&CAST[who].f;}
function paintFaceCanvas(cv,who,fobj){const f=fobj||faceOf(who);cv.width=16;cv.height=16;const x=cv.getContext('2d');x.clearRect(0,0,16,16);if(!f){x.fillStyle='#3a2a1a';x.fillRect(0,0,16,16);return;}paintGrid(x,faceGrid(f),0,0);}
function paintFaces(root){root.querySelectorAll('canvas[data-face]').forEach(cv=>paintFaceCanvas(cv,cv.dataset.face));}

function drawChart(){
  const cv=$('chart');if(!cv)return;const full=G.hist[G.sel];const n=U.range==='ALL'?full.length:Math.min(full.length,U.range);const s0=full.length-n,data=full.slice(s0);
  const W=cv.clientWidth,H=cv.clientHeight,k=2;cv.width=W*k;cv.height=H*k;const x=cv.getContext('2d');x.scale(k,k);
  let lo=Math.min(...data),hi=Math.max(...data);if(hi-lo<1e-6){hi+=1;lo-=1;}const pd=(hi-lo)*.08;lo-=pd;hi+=pd;
  const X=i=>4+(W-54)*(n<=1?0:i/(n-1)),Y=v=>6+(H-24)*(1-(v-lo)/(hi-lo));
  x.font='10px "IBM Plex Mono", monospace';
  const dayOf=i=>s0+i-PRE+1;const lab=i=>{const d=dayOf(i);return d<1?`${1-d} days before Day 1`:(d===G.day?'Today':'Day '+d);};
  x.fillStyle='#4fbf6a';x.textAlign='left';x.fillText(lab(0),4,H-3);x.textAlign='right';x.fillText(lab(n-1),W-52,H-3);x.textAlign='left';x.fillStyle='#4fbf6a';x.strokeStyle='#173d24';
  for(let j=0;j<=3;j++){const v=lo+(hi-lo)*j/3,y=Y(v);x.beginPath();x.moveTo(4,y);x.lineTo(W-50,y);x.stroke();x.fillText(v.toFixed(2),W-46,y+4);}
  const gi=PRE-s0;if(gi>=0&&gi<n){x.setLineDash([3,3]);x.strokeStyle='#ffd27a';x.beginPath();x.moveTo(X(gi),4);x.lineTo(X(gi),H-16);x.stroke();x.setLineDash([]);if(gi>40&&n-gi>30){x.fillStyle='#ffd27a';x.textAlign='center';x.fillText('Day 1 (you started)',X(gi),H-3);x.textAlign='left';}}
  const up=data[n-1]>=data[0];x.beginPath();data.forEach((v,i)=>i?x.lineTo(X(i),Y(v)):x.moveTo(X(i),Y(v)));x.strokeStyle=up?'#7dff8f':'#ff7b7b';x.lineWidth=2;x.stroke();
  G.trades.filter(tr=>tr.t===G.sel).forEach(tr=>{const i=PRE+tr.day-1-s0;if(i<0||i>=n)return;const px=X(i),py=Y(tr.p),u=tr.side==='buy'||tr.side==='cover';x.fillStyle=u?'#7dff8f':'#ff7b7b';x.beginPath();
    if(u){x.moveTo(px,py+3);x.lineTo(px-5,py+11);x.lineTo(px+5,py+11);}else{x.moveTo(px,py-3);x.lineTo(px-5,py-11);x.lineTo(px+5,py-11);}x.fill();});
}
function rangeCaption(){const full=G.hist[G.sel].length;const n=U.range==='ALL'?full:Math.min(full,U.range);const before=Math.max(0,n-G.day);
  return U.range==='ALL'?`All ${n} days: 120 before Day 1 + ${G.day} this year`:`Last ${n} trading days${before?` (${before} before Day 1)`:''}`;}
function drawPChart(){
  const cv=$('pchart');if(!cv)return;const W=cv.clientWidth,H=cv.clientHeight,k=2;cv.width=W*k;cv.height=H*k;const x=cv.getContext('2d');x.scale(k,k);
  const a=G.nw.map(v=>v/G.start),b=G.idx.slice(PRE).map(v=>v/G.idx[PRE]),c=G.chad.slice();
  let lo=Math.min(...a,...b,...c),hi=Math.max(...a,...b,...c);if(hi-lo<.02){hi+=.01;lo-=.01;}
  const X=i=>4+(W-8)*(i/(DAYS-1)),Y=v=>4+(H-8)*(1-(v-lo)/(hi-lo));
  x.strokeStyle='#173d24';x.beginPath();x.moveTo(0,Y(1));x.lineTo(W,Y(1));x.stroke();
  [[c,'#ff9ad5'],[b,'#8db4ff'],[a,'#ffd27a']].forEach(([s,col])=>{x.beginPath();s.forEach((v,i)=>i?x.lineTo(X(i),Y(v)):x.moveTo(X(i),Y(v)));x.strokeStyle=col;x.lineWidth=2;x.stroke();});
}

  if(avail.length){const s=avail[0];s.used=true;const tx=tipText(s);addLog(who,tx,s.id,tOfSig(s));G.lastCall[who]=tx;

  const ahead=myRet()>=chadRet();const opts=[

  say([{who:'boss',text:`Quarter ${Q+1} goal: ${gq.txt}. Right now you're ${ok?'ON TRACK':'BEHIND'}. You're at ${fp(myRet())}, the market is at ${fp(indexRet())}, and Chad is at ${fp(chadRet())}.`},
   {who:'boss',text:ok?'Keep it up. Don\'t get cocky.':`Review is on Day ${(Q+1)*15}. Fix it.`+(G.strikes?' You already have a strike.':'')}]);}
function chadTalk(){const ahead=myRet()>=chadRet();say([{who:'chad',text:ahead?pick(['Stop looking at me. I\'m having a… strategic dip.','Beginner\'s luck. My dad says it always runs out.']):pick(['Need tips? Too bad. Mine are proprietary.','You\'re behind me. It\'s okay. Most people are.','Ever heard of a vest? You should get one.'])}]);}

/* ---------------- CALLS ---------------- */
function useAP(){if(G.ap<=0){toast('Out of coffee today. Ring the closing bell to end the day.','bad');return false;}G.ap--;U.todTarget=Math.min(.85,(1-G.ap/(G.apMax+G.bonusAP))*.85);return true;}
function callContact(id){
  if(G.called[id]||!useAP())return;G.called[id]=true;if(G.tut==='call')G.tut='done';
  if(id==='garage')G.heat=Math.min(100,G.heat+4);
  const avail=G.signals.filter(s=>s.src===id&&!s.used&&s.day<=G.day&&EV(s.ev).day>G.day).sort((a,b)=>EV(a.ev).day-EV(b.ev).day);
  let text,sid=null,t=null;
  if(avail.length&&!(id==='garage'&&rand()<0.12)){const s=avail[0];s.used=true;text=tipText(s);sid=s.id;t=tOfSig(s);if(id==='garage'&&t)G.insider.push({t,dir:s.dir,evDay:EV(s.ev).day});}
  else if(id==='brayden'){const c=pick(CO);text=rand()<.5?`BRO. ${c.t} is about to MOON 🚀 My cousin's dentist said so.`:`Dude, I just lost my rent money on ${c.t}. Anyway, how's it going?`;}
  else text=pick(FILL_CALL[id]);
  G.lastCall[id]=text;addLog(id,text,sid,t);sfx('ring');save();
  say([{who:id,text}],()=>refresh());
}
function scrollChirper(){
  if(G.chirped||!useAP())return;G.chirped=true;
  const n=G.player.bg==='crypto'?3:2;
  const avail=G.signals.filter(s=>s.src==='chirp'&&!s.used&&s.day<=G.day&&EV(s.ev).day>G.day).sort((a,b)=>EV(a.ev).day-EV(b.ev).day).slice(0,n);
  const posts=[];avail.forEach(s=>{s.used=true;const tx=tipText(s);posts.push(tx);addLog('chirp',tx,s.id,tOfSig(s));});
  while(posts.length<4)posts.splice(rint(0,posts.length),0,`${pick(CHIRP_HANDLES)}: ${pick(CHIRP_NOISE)}`);
  G.chirps=posts;sfx('blip');save();refresh();
}
function doResearch(){const t=G.sel,Q=qtr(G.day);if(G.research[t]&&G.research[t].q===Q)return;if(!useAP())return;
  const q=G.q[t][Q];let b=q>0.22?'STRONG':q<-0.22?'WEAK':'MIXED';if(rand()<0.2)b=pick(['STRONG','MIXED','WEAK'].filter(x=>x!==b));
  G.research[t]={q:Q,b,day:G.day};addLog('research',`Research report on ${t}: fundamentals look ${b} this quarter.${b==='STRONG'?' Earnings beat more likely.':b==='WEAK'?' Earnings miss more likely.':''}`,null,t);
  sfx('page');save();refresh();}

/* ---------------- DAY CYCLE ---------------- */
function endDay(){
  if(G.over||U.dlg)return;
  if(G.tut==='paper'||G.tut==='buy'){toast('Finish your objective first.');return;}
  if(U.win)closeWin();
  if(G.tut==='bell')G.tut='day2';
  sfx('bell');bigText('🔔 CLOSING BELL');U.todTarget=1.35;
  const before=netWorth();const d=G.day;
  simulateClose();
  const after=netWorth();
  if(Math.abs(G.lastIdxMove)>0.022)U.shake=14;
  setTimeout(()=>{
    if(after<=0){finishGame('bankrupt');return;}
    showSummary(d,before,after,()=>{
      if(d>=DAYS){finalReview();return;}
      fade(true);
      setTimeout(()=>{
        G.day++;G.bonusAP=0;G.ap=G.apMax;G.called={};G.chirped=false;G.chirps=[];G.lastCall={};
        G.heat=Math.max(0,G.heat-2);G.insider=G.insider.filter(x=>x.evDay>=G.day);
        buildNews();
        G.pendingMargin=marginCheck();
        if((G.day-1)%15===0)G.pendingReview=qtr(G.day-1);
        G.pendingInv=investigationRoll();
        U.tod=0;U.todTarget=0;save();refresh();fade(false);
        bigText(`DAY ${G.day}`,900);
        setTimeout(()=>runQueue(morningQueue()),700);
      },500);
    });
  },1500);
}
function showSummary(d,before,after,next){
  const dp=after-before,dr=dp/Math.max(1,before);
  const movers=CO.map(c=>({c,ch:price(c.t)/prevPrice(c.t)-1})).sort((a,b)=>Math.abs(b.ch)-Math.abs(a.ch)).slice(0,3);
  const mine=Object.entries(G.pos).map(([t,ps])=>({t,pl:(price(t)-prevPrice(t))*ps.qty})).sort((a,b)=>b.pl-a.pl);
  card(`<div class="cardbox" style="max-width:560px"><h1>END OF DAY ${d}</h1>
   <div class="sumcols"><div><div class="kv"><span>Today's profit/loss</span><b class="${dp>=0?'g':'r'}">${dp>=0?'+':''}${fm(dp)} (${fp(dr,2)})</b>
   <span>Net worth</span><b>${fm(after)}</b><span>You this year</span><b class="${myRet()>=0?'g':'r'}">${fp(myRet())}</b>
   <span>Market this year</span><b>${fp(indexRet())}</b><span>Chad this year</span><b>${fp(chadRet())}</b>
   ${G.lastDiv?`<span>Quarterly dividends</span><b class="${G.lastDiv>=0?'g':'r'}">${G.lastDiv>=0?'+':''}${fm(G.lastDiv)}</b>`:''}
   ${mine.length?`<span>Your best mover today</span><b class="${mine[0].pl>=0?'g':'r'}">${mine[0].t} ${fm(mine[0].pl)}</b>`:''}</div>
   </div><div><h2>Biggest moves on the board</h2><div class="kv">${movers.map(m=>`<span>${m.c.n}</span><b class="${m.ch>=0?'g':'r'}">${fp(m.ch)}</b>`).join('')}</div></div></div>
   <p style="font-size:14px;color:#6b5440">${d%15===0?'⚠ Quarter-end review with The Hammer tomorrow morning.':(15-d%15)+' trading day'+(15-d%15===1?'':'s')+' until your next review.'}</p>
   <div class="btns"><button class="primary" data-act="cardnext">${d>=DAYS?'Final review ▶':'Go home & sleep ▶'}</button></div></div>`,next);
  sfx(dp>=0?'good':'page');
}
let cardNext=null;
function card(html,next){U.onTitle=false;$('card').innerHTML=html;$('card').classList.remove('hidden');cardNext=next||null;paintFaces($('card'));}
function closeCard(){U.onTitle=false;$('card').classList.add('hidden');$('card').innerHTML='';const n=cardNext;cardNext=null;if(n)n();}
function morningQueue(){
  const q=[],d=G.day;
  if(G.pendingReview!=null)q.push(reviewScene);
  if(d===2)q.push(ringScene('sal'));
  if(d===3)q.push(ringScene('mom'));
  if(d===4)q.push(shortScene);
  if(d===5)q.push(ringScene('brayden'));
  if(d===6)q.push(anaScene);
  if(d===7)q.push(chirpScene);
  if(d===9)q.push(garageScene);
  if(d===20&&G.flags.garage==='no')q.push(garageReoffer);
  if(d>9&&d%15!==1&&rand()<.28)q.push(flavorScene);
  if(G.pendingMargin)q.push(next=>{G.pendingMargin=false;say([{who:'boss',text:'MARGIN CALL. Your shorts got too big for your account, so compliance closed every one of them. That\'s coming out of your hide.'}],next);});
  if(G.pendingInv)q.push(invScene);
  return q;
}
function reviewScene(next){
  const Q=G.pendingReview;G.pendingReview=null;const gq=goal(Q),ok=gq.ok();G.reviews.push({Q,ok});
  const titles=['Analyst','Trader','Senior Trader'];
  if(ok){G.title=titles[Math.min(Q,2)];sfx('good');}else{G.strikes++;sfx('bad');}
  const fired=G.strikes>=2;
  say([{who:'narr',text:`Quarter ${Q+1} review. The Hammer's office. The door clicks shut.`},
   {who:'boss',text:`Your goal was: ${gq.txt}. You're at ${fp(myRet())}. The market is at ${fp(indexRet())}. Chad is at ${fp(chadRet())}.`},
   ok?{who:'boss',text:`You hit it. You're promoted to ${G.title}. Next quarter's goal: ${goal(Q+1).txt.toLowerCase()}.`}
     :fired?{who:'boss',text:'That\'s two misses. Pack your desk. Security will walk you out.'}
     :{who:'boss',text:`You missed. That's a strike. One more and you're done. Next quarter's goal: ${goal(Q+1).txt.toLowerCase()}.`},
   ok?{who:'chad',text:'Promoted? Whatever. My dad\'s on the board, I could get promoted any time I want.'}:{who:'chad',text:'Tough break, buddy. Want to borrow my vest?'}],
   ()=>{if(fired){finishGame('fired');return;}next();});
}
function investigationRoll(){if(G.heat<35)return false;const ch=G.heat>=100?1:(G.heat-35)/180;return rand()<ch;}
function invScene(next){
  G.pendingInv=false;const sp=suspiciousProfit(),n=G.flagged.length;
  if(n===0){G.heat=10;say([{who:'ledger',text:'Agent Doug Ledger, Trade Oversight Bureau. You\'ve been seen hanging around a certain parking garage.'},{who:'ledger',text:'Your trades look clean, though. For now. Have a nice day.'},{who:'narr',text:'Heat reset to 10.'}],next);return;}
  const f1=Math.round(Math.max(500,1.25*sp));
  say([{who:'ledger',text:'Agent Doug Ledger, Trade Oversight Bureau. Mind if I sit?'},
   {who:'ledger',text:`You made ${n} trade${n>1?'s':''} right before big news broke. Suspicious profits: about ${fm(sp,0)}. Care to explain the timing?`,
    choices:[
     {t:`Settle: hand back the profits plus a 25% penalty (${fm(f1,0)})`,fn:()=>{G.cash-=f1;G.stats.fines+=f1;G.heat=10;G.flagged=[];return[{who:'ledger',text:'Smart choice. Keep it clean.'}];}},
     {t:'Lawyer up: $2,000. Coin flip to get it tossed',cls:'primary',fn:()=>{G.cash-=2000;G.stats.fines+=2000;
       if(rand()<.5){G.heat=20;G.flagged=[];return[{who:'narr',text:'Your lawyer, Barry Loophole, Esq., gets the case tossed on a technicality.'}];}
       const f=Math.round(Math.max(1000,2*sp));G.cash-=f;G.stats.fines+=f;G.heat=40;G.flagged=[];return[{who:'ledger',text:`The judge isn't buying it. Fine: ${fm(f,0)}. I'll be watching you.`}];}},
     {t:'Deny everything (risky)',fn:()=>{const bust=n>=3?rand()<.6:rand()<.25;
       if(bust){G.flags.busted=true;return[{who:'ledger',text:'Funny. Your phone records say otherwise. You\'re under arrest.'}];}
       if(rand()<.6){G.heat=Math.max(0,G.heat-25);G.flagged=[];return[{who:'ledger',text:'...No further questions. For now.'}];}
       const f=Math.round(Math.max(1500,3*sp));G.cash-=f;G.stats.fines+=f;G.heat=55;G.flagged=[];return[{who:'ledger',text:`Nice try. Fine: ${fm(f,0)}.`}];}}]}],
   ()=>{if(G.flags.busted){finishGame('busted');return;}if(netWorth()<=0){finishGame('bankrupt');return;}save();next();});
}
function finalReview(){
  const ok=goal(3).ok();
  say([{who:'narr',text:'Day 60. The last bell of the fiscal year. The Hammer calls you in.'},
   {who:'boss',text:`The final numbers: you're at ${fp(myRet())}, the market at ${fp(indexRet())}, Chad at ${fp(chadRet())}.`},
   {who:'boss',text:ok?'You beat the market. In this building, that\'s the only thing that matters.':'You didn\'t beat the market. A monkey with an index fund did better. Think about that.'},
   myRet()>=chadRet()?{who:'chad',text:'...Good game. Don\'t tell anyone I said that.'}:{who:'chad',text:'Better luck next year, champ. I\'ll be in my corner office.'}],()=>finishGame('complete'));
}

/* ---------------- ENDINGS ---------------- */
const RANKS=[{min:.75,t:'Market Wizard Supreme',d:'Unreal. They\'re making a documentary about you. It\'s mostly about your vests.'},{min:.30,t:'Wolf of Mall-Wart',d:'You crushed the market. People wear vests to imitate you.'},{min:.10,t:'Senior Shark',d:'Double-digit outperformance. Recruiters are flooding your inbox.'},{min:0.0001,t:'Junior Trader',d:'You beat the market. Your desk gets a plant.'}];
function finishGame(reason){
  G.over=true;U.dlg=false;$('dlg').classList.add('hidden');if(U.win)closeWin();
  const r=myRet(),ir=indexRet(),a=r-ir;let rank;
  if(reason==='busted')rank={t:'Club Fed Inmate',d:'Eighteen months in minimum security. Your cellmate is an ex-Goldman Sax VP who won\'t stop talking about crypto.'};
  else if(reason==='fired')rank={t:'Escorted Out by Security',d:'Two missed goals. Your desk plant goes to Chad.'};
  else if(reason==='bankrupt')rank={t:'Margin-Called Into Oblivion',d:'Your account hit zero. Bizness Capital changed the locks.'};
  else if(r<-0.15)rank={t:'Bagholder Emeritus',d:'You held everything all the way down. A legendary cautionary tale.'};
  else if(r<0)rank={t:'Paper-Hands Intern',d:'Rough year. On the bright side, you learned a lot (and lost it).'};
  else if(a<=0)rank={t:'Index Fund Envier',d:'You made money, but a boring index fund made more.'};
  else rank=RANKS.find(x=>a>=x.min);
  let hof=[];try{hof=JSON.parse(localStorage.getItem(HOF_KEY)||'[]');}catch(e){}
  if(reason==='complete'){hof.push({name:G.player.name,rank:rank.t,r,a,seed:G.seed});hof.sort((x,y)=>y.a-x.a);hof=hof.slice(0,6);try{localStorage.setItem(HOF_KEY,JSON.stringify(hof));}catch(e){}}
  try{localStorage.removeItem(SAVE_KEY);}catch(e){}
  sfx(reason==='complete'&&a>0?'good':'bad');refresh();
  card(`<div class="cardbox"><div style="display:flex;gap:16px;align-items:center"><canvas data-face="player" style="width:96px;height:96px;image-rendering:pixelated;border:3px solid #3a2a1a;background:#7c6a55"></canvas>
   <div><h1>${reason==='busted'?'🚔 BUSTED':reason==='fired'?'📦 FIRED':reason==='bankrupt'?'💀 WIPED OUT':'🏁 FISCAL YEAR COMPLETE'}</h1><h2>${esc(G.player.name)}: <span style="color:#8c2f39">${rank.t}</span></h2><p>${rank.d}</p></div></div>
   <div class="kv"><span>Final net worth</span><b>${fm(netWorth())}</b><span>Your return</span><b class="${r>=0?'g':'r'}">${fp(r)}</b><span>Market return</span><b>${fp(ir)}</b>
   <span>You vs market</span><b class="${a>=0?'g':'r'}">${fp(a)}</b><span>Chad's return</span><b>${fp(chadRet())}</b><span>Trades</span><b>${G.stats.trades}</b>
   <span>Best closed trade</span><b>${G.stats.best?G.stats.best.t+' '+fm(G.stats.best.v):'—'}</b><span>Insider trades / fines</span><b>${G.stats.insiderTrades} / ${fm(G.stats.fines,0)}</b>
   <span>Market seed (replay)</span><b>${esc(G.seed)}</b></div>
   <div class="btns"><button class="primary" data-act="title">Main menu</button></div></div>`);
}

  if(isM()){card(`<div class="cardbox mcreate">
   <div style="display:flex;gap:10px;align-items:center"><canvas id="creatorFace"></canvas>
    <div style="flex:1"><div class="px" style="color:#8c2f39;font-size:13px">NEW HIRE PAPERWORK</div><input class="txt" id="nameIn" maxlength="18" placeholder="Your name" value="${esc(C.name)}" data-in="name" style="width:100%"><input id="seedIn" type="hidden" value="${esc(C.seed)}"></div>
    <button data-act="title">◀</button><button class="primary" data-act="startcareer">Start Day 1 ▶</button></div>
   <div style="display:flex;gap:8px;margin:6px 0;align-items:flex-end">${['skin','hair','hs','shirt'].map(k=>`<div class="cg"><span>${{skin:'Skin',hair:'Hair',hs:'Style',shirt:'Outfit'}[k]}</span><div><button data-act="cust" data-v="${k}" data-d="-1">◀</button><button data-act="cust" data-v="${k}" data-d="1">▶</button></div></div>`).join('')}
    <div class="cg"><span>Glasses</span><div><button data-act="cust" data-v="glasses" data-d="0">${C.glasses?'On':'Off'}</button></div></div></div>
   <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px">${Object.entries(BACKGROUNDS).map(([k,b])=>`<div class="bgopt ${C.bg===k?'on':''}" data-act="bg" data-v="${k}"><b>${b.n}</b><div>${b.d}</div></div>`).join('')}</div></div>`);paintCreator();return;}
  card(`<div class="cardbox"><h1>NEW HIRE PAPERWORK</h1><div style="display:flex;gap:20px">
   <div style="text-align:center" class="ccol"><canvas id="creatorFace"></canvas><div class="custs">
    ${['skin','hair','hs','shirt'].map(k=>`<div class="cust"><span>${{skin:'Skin',hair:'Hair',hs:'Style',shirt:'Outfit'}[k]}</span><button data-act="cust" data-v="${k}" data-d="-1">◀</button><button data-act="cust" data-v="${k}" data-d="1">▶</button></div>`).join('')}
    <div class="cust"><span>Glasses</span><button data-act="cust" data-v="glasses" data-d="0">${C.glasses?'On':'Off'}</button></div></div></div>
   <div style="flex:1"><div style="font-size:14px;color:#6b5440">Your name</div><input class="txt" id="nameIn" maxlength="18" placeholder="e.g. Jordan Belfry" value="${esc(C.name)}" data-in="name">
    <div style="font-size:14px;color:#6b5440;margin-top:10px">Background</div>
    ${Object.entries(BACKGROUNDS).map(([k,b])=>`<div class="bgopt ${C.bg===k?'on':''}" data-act="bg" data-v="${k}"><b>${b.n}</b><div>${b.d}</div></div>`).join('')}
    <div class="seedrow" style="font-size:12px;color:#6b5440;margin-top:6px">Market seed (optional, replays the same market): <input id="seedIn" data-in="seed" value="${esc(C.seed)}" style="width:110px;font-family:inherit"></div>
   </div></div>
   <div class="btns"><button data-act="title">◀ Back</button><button class="primary" data-act="startcareer" style="margin-left:auto">Sign &amp; start Day 1 ▶</button></div></div>`);
  paintCreator();
}
function creatorFace(){const C=U.creator;return{skin:LOOKS.skin[C.skin],hair:LOOKS.hair[C.hair],hs:LOOKS.hs[C.hs],shirt:LOOKS.shirt[C.shirt],acc:C.glasses?['glasses','collar']:['collar']};}
function paintCreator(){const cv=$('creatorFace');if(cv)paintFaceCanvas(cv,null,creatorFace());}
function helpCard(back){card(handbookHtml(),back);}

function handbookHtml(){
  const u=G?G.unlock:{};const sec=(ok,t,body,sh)=>`<div class="sect" style="padding:3px 0;border-bottom:1px dashed #b9a988"><b>${ok?t:'🔒 '+t}</b><div class="lg" style="font-size:14px;color:${ok?'#3a2a1a':'#9a8a70'}">${ok?body:'You\'ll unlock this later in your career.'}</div><div class="shx" style="color:${ok?'#3a2a1a':'#9a8a70'}">${ok?sh:'Unlocks later.'}</div></div>`;
  const sd=(qtr(G.day)+1)*15;
  return `<div class="cardbox hb" style="max-width:780px;padding:14px 22px;position:relative"><button class="hbx" data-act="closecard">✕</button><h1>📘 TRADER'S HANDBOOK</h1><p class="hbsub" style="font-size:13px;color:#6b5440;margin:0 0 4px">Quick reference for everything you've unlocked. Day ${G.day}, Q${qtr(G.day)+1}.</p>
  <div class="hbgrid">
   ${sec(true,'📰 Newspaper','Headlines already moved prices overnight. The calendar and rumor mill hint at what\'s coming.','Headlines already moved prices. The calendar and rumors hint at what\'s next.')}
   ${sec(true,'🖥 Computer','BUY when you expect a rise. SELL to cash out. Each order costs $4.95. Charts show 120 days before Day 1 plus this year.','BUY if you expect a rise, SELL to cash out. $4.95 per order.')}
   ${sec(u.short,'▼ Shorting','SHORT to profit from a fall. COVER to close. Shorts pay a daily fee, and losses grow without limit if the price rises.','SHORT to profit from a fall, COVER to close. Daily fee, unlimited risk.')}
   ${sec(true,'💵 Dividends','Some steady companies share their profits. Dividends build up every day you hold the stock and pay out at quarter end (next: Day '+sd+'). Shorts pay them instead.','Build up daily while you hold. Paid at quarter end (Day '+sd+'). Shorts pay.')}
   ${sec(true,'🚪 The Hammer','Hit her goal each quarter (Days 15, 30, 45, 60). Two misses and you\'re fired. Click her door to check your status.','Hit her goal on Days 15/30/45/60. Two misses = fired. Tap her door.')}
   ${sec(u.phone,'☎ Phone and ☕ coffee','Each call costs one coffee. You get '+G.apMax+' a day. Trading is free.','Each call costs ☕1. You get '+G.apMax+' a day. Trading is free.')}
   ${sec(u.notebook,'📒 Notepad','Every tip is saved and stamped RIGHT or WRONG once the news breaks. Learn who to trust.','Every tip is saved, then stamped RIGHT or WRONG.')}
   ${sec(u.ana,'📊 Earnings and research','Companies report once a quarter. Ana previews beat or miss. A research report (one coffee) rates fundamentals STRONG or WEAK.','Ana previews beat or miss. Research (☕1) rates STRONG or WEAK.')}
   ${sec(u.chirp,'📱 Chirper','Mostly noise, sometimes a real leak. Costs one coffee per scroll.','Mostly noise, sometimes a real leak. ☕1 per scroll.')}
   ${sec(u.garage,'🕵 Heat','Trading on the Parking Garage guy\'s tips raises heat. High heat brings Agent Ledger.','Garage tips raise heat. High heat brings Agent Ledger.')}
  </div>
  <div class="btns hbbtn"><button class="primary" data-act="closecard">Back to work</button></div></div>`;
}
function oldHelp(back){card(`<div class="cardbox"><h1>HOW TO PLAY</h1>
  <p>📰 <b>Read the paper</b> every morning. Headlines show what already happened. The rumor mill and calendar hint at what's coming.</p>
  <p>☎ <b>Work the phone.</b> Each call costs a ☕ coffee. Every contact has a specialty and gets things wrong sometimes. Your 📒 notepad stamps each tip RIGHT or WRONG once the news breaks.</p>
  <p>🖥 <b>Trade on your computer.</b> BUY if you think a stock will rise. Once unlocked, SHORT if you think it will fall. Every company has been public for years (see "Public since"), but BIZTERM only stores price history from 120 trading days (about 6 months) before your first day, plus everything since.</p>
  <p>🔔 <b>Ring the bell</b> to end the day. Prices move overnight, so what you're holding matters.</p>
  <p>🚪 <b>Hit The Hammer's goal</b> each quarter (every 15 days). Two misses and you're fired. Beat Chad and the market by Day 60.</p>
  <div class="btns"><button class="primary" data-act="closecard">Got it</button></div></div>`,back);}

/* ---------------- INPUT ---------------- */
document.addEventListener('click',e=>{
  if(isM()&&!e.target.closest('.hs')&&U.armed){U.armed=null;document.querySelectorAll('.hs.armed').forEach(x=>x.classList.remove('armed'));}
  if(e.target.closest('#dlg')&&!e.target.closest('button')){dlgClick(e);return;}
  const el=e.target.closest('[data-act]');if(!el)return;const a=el.dataset.act,v=el.dataset.v;
  switch(a){
   case 'hs':{if(isM()&&v!==U.target&&U.armed!==v){U.armed=v;document.querySelectorAll('.hs.armed').forEach(x=>x.classList.remove('armed'));el.classList.add('armed');sfx('click');break;}U.armed=null;hsClick(v);break;}
   case 'mview':U.mview=v;renderWin();break;
   case 'msel':G.sel=v;U.mview='stock';sfx('click');renderWin();break;
   case 'qadj':U.qty=Math.max(0,U.qty+(+v));renderWin();break;
   case 'qclr':U.qty=0;renderWin();break;
   case 'close':if(!U.dlg)closeWin();break;
   case 'bell':hsClick('bell');break;
   case 'ctab':U.ctab=v;renderWin();break;
   case 'sel':G.sel=v;sfx('click');renderWin();break;
   case 'selm':G.sel=v;U.ctab='market';U.mview='stock';renderWin();break;
   case 'gotot':G.sel=v;U.mview='stock';openWin('computer');break;
   case 'range':U.range=v==='ALL'?'ALL':+v;renderWin();break;
   case 'qty':{let q=v==='max'?maxBuy(G.sel):v==='all'?Math.abs((G.pos[G.sel]||{qty:0}).qty):+v;U.qty=q;if(isM()){renderWin();break;}const i=$('qty');if(i)i.value=q;updEst();break;}
   case 'trade':trade(G.sel,v,U.qty);break;
   case 'research':doResearch();break;
   case 'call':callContact(v);refresh();break;
   case 'chirp':scrollChirper();break;
   case 'nbf':U.nbFilter=v;U.nbPage=0;renderWin();break;
   case 'nbp':U.nbPage+=+v;renderWin();break;
   case 'choice':choose(+v);break;
   case 'cardnext':closeCard();break;
   case 'closecard':closeCard();break;
   case 'help':{const back=U.onTitle?()=>titleScreen():null;helpCard(back);break;}
   case 'sound':muted=!muted;refresh();break;
   case 'menu':if(U.dlg)break;save();titleScreen();break;
   case 'title':closeCardSilent();titleScreen();break;
   case 'continue':if(load()){closeCardSilent();ensureState();refresh();U.tod=(1-G.ap/G.apMax)*.85;U.todTarget=U.tod;toast(`Welcome back. Day ${G.day}.`);
     if(G.tut==='intro')runQueue([introScene]);else if(G.day>=9&&!G.flags.garage)runQueue([garageScene]);}break;
   case 'newcareer':U.creator=null;creator();break;
   case 'cust':{const C=U.creator;if(v==='glasses')C.glasses=!C.glasses;else{const arr=LOOKS[v];C[v]=(C[v]+(+el.dataset.d)+arr.length)%arr.length;}C.name=$('nameIn').value;C.seed=$('seedIn').value;creator();break;}
   case 'bg':U.creator.bg=v;U.creator.name=$('nameIn').value;U.creator.seed=$('seedIn').value;creator();break;
   case 'startcareer':{const C=U.creator;C.name=$('nameIn').value.trim()||'Rookie';C.seed=$('seedIn').value;
     newGame({name:C.name,face:creatorFace(),bg:C.bg,seed:C.seed});closeCardSilent();U.tod=0;U.todTarget=0;save();refresh();runQueue([introScene]);break;}
  }
});
document.addEventListener('mouseover',e=>{$('stage').classList.toggle('hovering',!!e.target.closest('.hs'));});
document.addEventListener('input',e=>{const k=e.target.dataset.in;if(k==='qty'){U.qty=Math.max(0,Math.floor(+e.target.value||0));updEst();}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&U.win&&!U.dlg)closeWin();if((e.key===' '||e.key==='Enter')&&U.dlg&&document.activeElement.tagName!=='INPUT'){e.preventDefault();dlgClick(e);}});
function closeCardSilent(){U.onTitle=false;$('hud').classList.remove('hidden');$('monitor').style.visibility='visible';$('card').classList.add('hidden');$('card').innerHTML='';$('card').style.background='';cardNext=null;}
function ensureState(){const d=G.day;if(d>=2){G.unlock.phone=true;G.unlock.notebook=true;G.unlock.sal=true;}if(d>=3)G.unlock.mom=true;if(d>=4)G.unlock.short=true;if(d>=5)G.unlock.brayden=true;if(d>=6){G.unlock.ana=true;G.unlock.research=true;}if(d>=7)G.unlock.chirp=true;if(G.ring){/* re-ring on load */U._ringNext=null;}}

/* ---------------- BOOT ---------------- */
function fit(){const s=Math.min(innerWidth/960,innerHeight/540);$('stage').style.transform=`translate(-50%,-50%) scale(${s})`;}
const UI_IDS=['hud','objective','endDay','heatBox','shade','win','dlg','card','bigText','fade','toasts'];
const FORCE_M=/[?&]mobile=1/.test(location.search);
function isM(){return document.body.classList.contains('m');}
function applyMode(){
  const m=FORCE_M||(matchMedia('(pointer:coarse)').matches&&Math.min(innerWidth,innerHeight)<600);
  const was=isM();document.body.classList.toggle('m',m);document.body.classList.toggle('portrait',innerHeight>innerWidth);
  if(m!==was||!applyMode.done){const host=m?$('ui'):$('stage');UI_IDS.forEach(id=>host.appendChild($(id)));applyMode.done=true;}
  fit();if(G&&$('hud').innerHTML){refresh();if(U.win)renderWin();}
}
addEventListener('resize',applyMode);addEventListener('orientationchange',()=>setTimeout(applyMode,250));applyMode();
document.addEventListener('visibilitychange',()=>{if(document.hidden)save();});addEventListener('pagehide',save);
(function boot(){
  // backdrop game so the office isn't empty behind the title
  G=null;const keep=hasSave();
  if(keep&&load()){}else{newGame({name:'',face:CAST.chad.f,bg:'grinder',seed:'backdrop'});}
  refresh();loop();titleScreen();
})();
</script>
